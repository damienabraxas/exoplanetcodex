# config/physics_regime_rya400.yaml
# =================================================================================
# RYA-400 "The Beast" — per-element physics-regime map for all 27 (26 symbols; Fe I/II
# split). The single source of truth for each element's 1D-vs-3D × LTE-vs-NLTE regime,
# grid/data availability, indicator lines, hazards, and routing verdict — the homework
# that earns the RYA-371 Phase-C serious validation.
#
# Validate-don't-tune. Every regime CALL carries a citation (value-provenance); none is
# asserted from memory. The `verified_in_repo` block of each element is cross-checked
# against the live code by scripts/audit_physics_regime_rya400.py (a LOCKED row that is
# not actually wired loud-fails). Correction magnitudes are dex, solar (FGK-dwarf) unless
# noted; "see <cite>" = the regime DIRECTION is cited but a precise solar number was not
# pinned in this pass (do not invent one).
#
# Verdicts: LOCKED | GET-GRID | GET-3D | GET-DATA | HARD-carry-forward
# Routing : RYA-399 = 3D-extension arm; RYA-396-pattern = NLTE-grid vendoring (INSPECT/
#           MPIA/CDS/Amarsi-GALAH); RYA-119 = HST/MAST data; RYA-102/103/161 = open bugs.

meta:
  ticket: RYA-400
  gates: RYA-371-PhaseC
  regime_authority: "Asplund, Amarsi & Grevesse 2021, A&A 653, A141 (3D non-LTE solar abundances)"
  galah_nlte_grids: "Amarsi et al. 2020, A&A 642, A62 — public NLTE departure-coeff grids for H, Li, C, N, O, Na, Mg, Al, Si, K, Ca, Mn, Ba"
  amarsi2020_dabun_range: "relaxing LTE changes line abundances -0.7..+0.2 dex (line/star dependent)"
  conventions:
    feh_axis: "[X/H] RELATIVE (0.0 at solar); pass stellar_params['feh'] directly (RYA-256)"
    hfs: "splitting handled via the VALD HFS-on extraction convention (per-element confirmed below)"
    corr_sign: "delta_nlte = A_NLTE - A_LTE; A(X;NLTE) = A(X;1D-LTE) + delta (RYA-339 sign guard)"

