  data.kurucz2005_irradiance:
    root: data
    rel: spectra/KITTS/irradthu.dat.txt
    kind: file
    desc: >-
      Kurucz 2005 solar irradiance (irradthu.dat, revised 02jan2010), the
      telluric-CORRECTED Kitt Peak reference. Registered by RYA-933/934 so the two
      properties that bite every naive reader are declared in one place rather than
      rediscovered: the grid is VACUUM (RYA-938 measured it; reading it as air
      displaces every line ~1.7 A at 6600 A) and the flux is ABSOLUTE irradiance in
      W/m2/nm, so the holding ships no continuum. Spans 3000-10000 A.
  data.kurucz2005_residual:
    root: data
    rel: spectra/KITTS/irradrelwl.dat
    kind: file
    desc: >-
      Kurucz 2005 RESIDUAL irradiance atlas (irradrelwl.dat) -- the same spectrum as
      irradthu.dat with KURUCZ'S OWN CONTINUUM DIVIDED OUT. Registered by RYA-933 after
      the flux file was normalised here with a placed spline: the 0irrad.readme does not
      list this file, so the RYA-929 intake never took it and the holding was recorded as
      shipping no continuum. It does. Placing our own instead put a 4% blue-to-red tilt on
      the band (1.0238 at 4400 A to 0.9848 at 6800 A against the 1984 atlas) and biased
      A(Fe I) low by 0.022 dex; the shipped continuum tilts 12x less (-0.0033 across the
      band). Header: "KURUCZ RESIDUAL IRRADIANCE ATLAS 2005 / 299.000 by 0.001 to
      1001.000 nm / vacuum wavelength including gravitational red shift" -- VACUUM, like
      irradthu.dat, so the same vac->air conversion applies (verified: 0.000 A shift
      against the air 1984 atlas, r=0.9997). sha256
      75dd93479b5d3fe63c2e7828f5dbb3ce29f4c672f4f1147e0d30ce41bc8f5adb.
