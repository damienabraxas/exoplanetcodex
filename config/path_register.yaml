    kind: file
    desc: >-
      RYA-1232 CRIRES+ H arm from OUR seven Vesta IDPs, molecfit-corrected over every H
      segment (rya1191_crires_h_correct --full-arm; H2O+CO2+CH4, per-night GDAS) and
      rest-frame conditioned by rya1214_condition_crires_jk --arm H (all 7 frames PASS:
      |v - Horizons| <= 0.6 km/s, held-out <= 0.2 km/s, closure <= 0.24 km/s).
  repo.crires_plus_solar_h_rya1094:
    root: repo
    rel: data/results/rya1048/vesta_crires_plus_H_15007_17494_normalized.csv
    kind: file
    desc: >-
      CRIRES+ Elgueta+2026 SOLAR H arm, 15007.11-17493.69 A, conditioned by the SAME
      normaliser as the RYA-794/1054 Y products (scripts/normalize_vesta_ir.py --arm H).
      Two columns, wavelength_air_A and flux_normalized, 40559 rows. Source
      sp/Sun_H_rv.dat (nm -> x10 A, air; the ReadMe's 0.1nm label is wrong -- verified
      against the committed Y product, wavelengths agree to 1.8e-12 A). Telluric
      MEASURED not assumed: 0.48% of points below 0.5, against 51.3% for Kitt Peak's
      O2 A-band. RYA-1094.
  repo.crires_plus_solar_y_wide_rya1054:
    root: repo
    rel: data/results/rya794/vesta_crires_plus_Y_9800_10796_normalized.csv
    kind: file
    desc: >-
      CRIRES+ Vesta solar Y arm conditioned over its FULL measured extent,
      9800-10796 A (RYA-1054). Same source (sp/Sun_Y_rv.dat) and same normaliser as
      the RYA-794 product; only the window differs. Elgueta's 10280-10680 window is
      not a telluric limit -- below 10280 the arm runs 0.00-0.26% of points under 0.5
      against 0.06-0.21% inside it -- and the wider product carries 5 primary-lab
      Fe I lines where the narrow one carries 1.
  repo.crires_plus_solar_y_rya794:
    root: repo
    rel: data/results/rya794/vesta_crires_plus_Y_10280_10680_normalized.csv
    kind: file
    desc: >-
      CRIRES+ Vesta solar Y arm, 10280-10680 A, TELLURIC-CORRECTED and already
      continuum-normalised (RYA-794). Built by scripts/normalize_vesta_ir.py from
      Elgueta+2026's sp/Sun_Y_rv.dat; registered as holding
      `solar_crires_plus_y_rya794` with telluric_applied=applied. Two columns,
      wavelength_air_A and flux_normalized, 13707 rows, flux median 0.9985 --
      PRE-NORMALISED IS TRUE FOR THIS HOLDING and false for the raw
      solar_vesta_crires_plus_idp frames of the same instrument, which is why
      normalisation is a per-holding fact and not a per-instrument one (RYA-904).
      It had no register key until RYA-904 and so could not be named by a loader.
