# =============================================================================
# CODEX PATH REGISTER  (RYA-800)
# =============================================================================
# THE SINGLE SOURCE OF TRUTH for where things live on disk.
#
# WHY THIS EXISTS
# ---------------
# The repo carried 113 hardcoded absolute path literals against 10 calls to the
# RYA-567 resolver -- despite constants.py stating the rule outright ("no ad-hoc
# path literals"). That cost us twice in one day:
#
#   * A guard measured free space on a NOMINAL path while the bytes followed a
#     symlink to a different drive, filling the one drive that must not fill.
#   * Moving 512 GiB of grids to a new drive meant every one of those literals
#     had to be audited by hand to find out whether it still resolved.
#
# It is also a LEAK: absolute paths bake machine layout -- mount points, drive
# names, usernames -- into a git history that outlives the machine. The repo
# should carry STRUCTURE (logical name -> relative location); only the ROOT is
# machine-specific, and roots come from the environment, never from a commit.
#
# HOW IT WORKS
# ------------
#   roots:    logical root -> env var + default. THE ONLY machine-specific part.
#   entries:  logical key  -> {root, rel, kind, desc[, env]}
#             An entry's optional `env` replaces the WHOLE path (RYA-1233): for a
#             store whose layout differs on a mirror host (the Mac's KP atlas).
#
# DEFAULTS ARE SIRIUS. All data (VALD, spectra, grids, engines) lives on Sirius
# until there is a database; a run there needs NO environment at all. Another host
# overrides roots from a committed profile: config/hosts/<host>.env.
#
# Resolve with config.constants:
#     codex_path('grids.gerber_ts')            -> Path, no existence check
#     require_codex_path('grids.gerber_ts')    -> Path, LOUD-FAIL if absent
#
# RULES
#   * Add an entry here rather than writing a literal in Python.
#   * Never commit a path containing a username or a personal directory.
#   * `removable: true` marks a store that can physically vanish -- the resolver
#     checks its mount sentinel, because a stale mount reads as an EMPTY
#     DIRECTORY rather than raising, and empty silently looks like "no data".
# =============================================================================

version: 1

roots:
  data:
    env: SIRIUS_DATA_ROOT
    default: /mnt/codex-data
    desc: >-
      Primary Codex data drive (sda). Spectra, engines, per-ticket working dirs.
      After the RYA-800 consolidation this no longer holds the grids.
  grids:
    env: CODEX_GRID_ROOT
    default: /mnt/codex-ext/codex-grids
    removable: true
    mount: /mnt/codex-ext
    sentinel: /mnt/codex-ext/.codex_ext_mounted
    desc: >-
      ALL NLTE departure grids and model atmospheres (512 GiB), consolidated
      RYA-800. External USB volume, fstab UUID 10D4EB97D4EB7CFA, nofail.
      REMOVABLE: an unplug takes every grid offline at once, and a stale NTFS
      mount presents as an empty directory rather than an error -- hence the
      sentinel check. Legacy /mnt/codex-data/grids and /srv/codex/grids are
      symlinks here and continue to resolve.
  local_data:
    env: CODEX_LOCAL_DATA_ROOT
    default: '{repo_parent}/data'
    desc: >-
      Workstation-side data that is NOT on Sirius: a few staging CSVs. (The raw
      spectra tree used to live here too; it moved to Sirius on 2026-08-16 -- see
      data.spectra_local.) Derived from the repo's own location ({repo_parent} = the
      directory containing the checkout, where `data/` sits as a sibling of the
      worktrees), so it needs NO configuration and, critically, NO username. The
      15 literals this replaces each hardcoded an absolute /Users/<name>/... path
      into git -- unrunnable by anyone else, and a disclosure in a shared repo.
  srv_solar:
    env: CODEX_SRV_SOLAR_ROOT
    default: /srv/codex/solar_reference
    desc: >-
      Solar reference atlases kept on the OS drive (distinct from
      /mnt/codex-data/solar_reference, which is a different tree -- do not merge them
      without checking, they are not the same directory).
  work:
    env: CODEX_WORK_ROOT
    default: /mnt/codex-data/codex
    desc: >-
      Per-ticket scratch on Sirius (codex/ryaNNN/work, codex/_solar_tmp/...). Synthesis
      drivers write here. Registered so a driver names a KEY plus its ticket id rather
      than pasting an absolute path -- the pattern that made these ~60 literals.
  engines:
    env: CODEX_ENGINE_ROOT
    default: /mnt/codex-data/engines
    desc: Synthesis engines (Turbospectrum_NLTE, iSpec, PySME, TSFitPy).
  eso_pipelines:
    env: CODEX_ESO_ROOT
    default: /srv/codex/eso/molecfit
    desc: >-
      The ESO pipeline install prefix (esorex + molecfit recipes + telluriccorr
      data). Machine-specific by nature: Sirius builds ESO's source kit under
      /srv/codex/eso/molecfit, the Mac installs the Homebrew tap under
      /opt/homebrew. RYA-939 registered it because the telluric runner had the
      Mac's esorex path baked in, which made the whole correction leg Mac-only
      for no reason -- and a missing engine must fail loudly, never read as an
      uncorrected product. Resolution order in code is $ESOREX, then PATH, then
      this root; the root is what makes the SIRIUS default declared in one place.
  home:
    env: CODEX_HOME_ROOT
    default: '~'
    desc: >-
      The account's home directory on the host running the pipeline (per-user venvs).
      Expanded from ~, so no username is committed.
  repo:
    env: CODEX_REPO_ROOT
    default: '{repo}'
    desc: >-
      The repo checkout itself, for artifacts that are GIT-TRACKED rather than
      staged on a data drive (RYA-904). Most register entries point at machine
      storage; a derived science product committed under data/results/ is a
      different kind of thing -- it travels with the checkout, so its only
      machine-specific part is where the checkout is, which `{repo}` already
      knows. Registering them here rather than writing `ROOT / "data" / ...` in
      a loader means a product's location is declared in ONE place that the
      loader, the tests and the guard all read (RYA-810).

