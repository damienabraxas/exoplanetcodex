# =============================================================================
# CODEX PATH REGISTER  (RYA-800)
# =============================================================================
# THE SINGLE SOURCE OF TRUTH for where things live on disk.
#
# WHY THIS EXISTS
# ---------------
# The repo carried 113 hardcoded absolute path literals against 10 calls to the
# RYA-567 resolver -- despite constants.py stating the rule outright ("no ad-hoc
# path literals"). That cost us twice in one day:
#
#   * A guard measured free space on a NOMINAL path while the bytes followed a
#     symlink to a different drive, filling the one drive that must not fill.
#   * Moving 512 GiB of grids to a new drive meant every one of those literals
#     had to be audited by hand to find out whether it still resolved.
#
# It is also a LEAK: absolute paths bake machine layout -- mount points, drive
# names, usernames -- into a git history that outlives the machine. The repo
# should carry STRUCTURE (logical name -> relative location); only the ROOT is
# machine-specific, and roots come from the environment, never from a commit.
#
# HOW IT WORKS
# ------------
#   roots:    logical root -> env var + default. THE ONLY machine-specific part.
#   entries:  logical key  -> {root, rel, kind, desc}
#
# Resolve with config.constants:
#     codex_path('grids.gerber_ts')            -> Path, no existence check
#     require_codex_path('grids.gerber_ts')    -> Path, LOUD-FAIL if absent
#
# RULES
#   * Add an entry here rather than writing a literal in Python.
#   * Never commit a path containing a username or a personal directory.
#   * `removable: true` marks a store that can physically vanish -- the resolver
#     checks its mount sentinel, because a stale mount reads as an EMPTY
#     DIRECTORY rather than raising, and empty silently looks like "no data".
# =============================================================================

version: 1

roots:
  data:
    env: SIRIUS_DATA_ROOT
    default: /mnt/codex-data
    desc: >-
      Primary Codex data drive (sda). Spectra, engines, per-ticket working dirs.
      After the RYA-800 consolidation this no longer holds the grids.
  grids:
    env: CODEX_GRID_ROOT
    default: /mnt/codex-ext/codex-grids
    removable: true
    mount: /mnt/codex-ext
    sentinel: /mnt/codex-ext/.codex_ext_mounted
    desc: >-
      ALL NLTE departure grids and model atmospheres (512 GiB), consolidated
      RYA-800. External USB volume, fstab UUID 10D4EB97D4EB7CFA, nofail.
      REMOVABLE: an unplug takes every grid offline at once, and a stale NTFS
      mount presents as an empty directory rather than an error -- hence the
      sentinel check. Legacy /mnt/codex-data/grids and /srv/codex/grids are
      symlinks here and continue to resolve.
  local_data:
    env: CODEX_LOCAL_DATA_ROOT
    default: '{repo_parent}/data'
    desc: >-
      Workstation-side data that is NOT on Sirius: a few staging CSVs. (The raw
      spectra tree used to live here too; it moved to Sirius on 2026-08-16 -- see
      data.spectra_local.) Derived from the repo's own location ({repo_parent} = the
      directory containing the checkout, where `data/` sits as a sibling of the
      worktrees), so it needs NO configuration and, critically, NO username. The
      15 literals this replaces each hardcoded an absolute /Users/<name>/... path
      into git -- unrunnable by anyone else, and a disclosure in a shared repo.
  srv_solar:
    env: CODEX_SRV_SOLAR_ROOT
    default: /srv/codex/solar_reference
    desc: >-
      Solar reference atlases kept on the OS drive (distinct from
      /mnt/codex-data/solar_reference, which is a different tree -- do not merge them
      without checking, they are not the same directory).
  work:
    env: CODEX_WORK_ROOT
    default: /mnt/codex-data/codex
    desc: >-
      Per-ticket scratch on Sirius (codex/ryaNNN/work, codex/_solar_tmp/...). Synthesis
      drivers write here. Registered so a driver names a KEY plus its ticket id rather
      than pasting an absolute path -- the pattern that made these ~60 literals.
  engines:
    env: CODEX_ENGINE_ROOT
    default: /mnt/codex-data/engines
    desc: Synthesis engines (Turbospectrum_NLTE, iSpec, PySME, TSFitPy).
  eso_pipelines:
    env: CODEX_ESO_ROOT
    default: /srv/codex/eso/molecfit
    desc: >-
      The ESO pipeline install prefix (esorex + molecfit recipes + telluriccorr
      data). Machine-specific by nature: Sirius builds ESO's source kit under
      /srv/codex/eso/molecfit, the Mac installs the Homebrew tap under
      /opt/homebrew. RYA-939 registered it because the telluric runner had the
      Mac's esorex path baked in, which made the whole correction leg Mac-only
      for no reason -- and a missing engine must fail loudly, never read as an
      uncorrected product. Resolution order in code is $ESOREX, then PATH, then
      this root; the root is what makes the SIRIUS default declared in one place.
  repo:
    env: CODEX_REPO_ROOT
    default: '{repo}'
    desc: >-
      The repo checkout itself, for artifacts that are GIT-TRACKED rather than
      staged on a data drive (RYA-904). Most register entries point at machine
      storage; a derived science product committed under data/results/ is a
      different kind of thing -- it travels with the checkout, so its only
      machine-specific part is where the checkout is, which `{repo}` already
      knows. Registering them here rather than writing `ROOT / "data" / ...` in
      a loader means a product's location is declared in ONE place that the
      loader, the tests and the guard all read (RYA-810).

entries:
  # ---- grid stores -------------------------------------------------------
  grids.gerber_ts:
    root: grids
    rel: nlte/gerber_ts
    kind: dir
    desc: >-
      Gerber+2023 Turbospectrum-native NLTE deck (Engine B), md5-pinned.
      Atoms staged: Ba Ca Co Cr Fe Mg Mn Na Ni O Si Sr Ti. Not staged: Al Y Eu
      (RYA-801/802/803 in flight); H present via RYA-804. STAGED != WIRED --
      an element is `wired` only once its RYA-534 anchor gate passes.
  grids.amarsi_galah:
    root: grids
    rel: nlte/amarsi_galah
    kind: dir
    desc: Amarsi GALAH DR3 PySME departure grids (+ Cu Caliskan-2024, Ti Mallinson-2024).
  grids.model_atmospheres:
    root: grids
    rel: model_atmospheres
    kind: dir
    desc: MARCS / ATLAS9 model-atmosphere grids.
  grids.marcs_standard:
    root: grids
    rel: model_atmospheres/marcs_standard_comp/marcs_standard_comp
    kind: dir
    desc: MARCS standard-composition models (the doubled path segment is upstream's).
  grids.payload_pins:
    root: grids
    rel: PAYLOAD_PINS_rya800.md5
    kind: file
    desc: >-
      md5 for all 15838 grid files / 512.15 GiB. Covers the UNPACKED payloads that
      no prov JSON pins -- prov pins the transient .zip, so ~426 GiB previously had
      no pin at all. Generated from the verified source-vs-destination comparison.

  # ---- engines -----------------------------------------------------------
  engines.turbospectrum:
    root: engines
    rel: Turbospectrum_NLTE
    kind: dir
    desc: Turbospectrum_NLTE, BSYN v20.1 with the NLTE path compiled in.
  engines.ts_exec:
    root: engines
    rel: Turbospectrum_NLTE/exec-gf
    kind: dir
    desc: TS build dir. NOTE runtime binaries are invoked from bin/ on Sirius.
  engines.ts_interpolator:
    root: engines
    rel: Turbospectrum_NLTE/interpolator/interpol_modeles_nlte
    kind: file
    desc: 4D departure-coefficient interpolator.
  engines.ts_linelists:
    root: engines
    rel: Turbospectrum_NLTE/COM/linelists
    kind: dir
    desc: >-
      GES NLTE line lists. ⚠️ Cr I/II are tagged LTE in BOTH bundled lists, so a
      Cr NLTE gate cannot run from them (bsyn silently drops to LTE, RYA-533).
  engines.ispec:
    root: engines
    rel: ispec_src
    kind: dir
    desc: iSpec. Honour ISPEC_DIR when set.
  engines.tsfitpy:
    root: engines
    rel: TSFitPy
    kind: dir
    desc: TSFitPy. utilities/nlte_grids_links.cfg is the AUTHORITY for grid URLs.
  engines.nlte_grid_links_cfg:
    root: engines
    rel: TSFitPy/utilities/nlte_grids_links.cfg
    kind: file
    desc: >-
      Upstream grid URL catalogue, 17 elements. Authoritative over the Gerber 2023
      abstract, which omits Cr and Eu.

  # ---- data --------------------------------------------------------------
  data.spectra:
    root: data
    rel: spectra
    kind: dir
    desc: Per-target staged spectra (alpha_cen_a/b, procyon, tau_boo, eps_eri, sol...).
  data.linelists:
    root: data
    rel: linelists
    kind: dir
    desc: VALD / GES line-list extracts.
  data.spectra_local:
    root: data
    rel: spectra/_mac_import_20260816
    kind: dir
    desc: >-
      The per-target raw-spectra tree (Alpha Centauri A/B, 55 Cancri, Procyon, Tau
      Bootis, Solar Calibration, ...). ⚠️ NO LONGER WORKSTATION-LOCAL despite the key
      name: on 2026-08-16 this tree was moved off the Mac to Sirius and deleted from
      the Mac, after verifying 4,817 files / 43,345,884,770 B identical on both sides
      plus a 20-file MD5 sample. It was NOT already on Sirius -- the counterpart dirs
      there (55cnc_a, alpha_cen_a, alpha_cen_b) were EMPTY STUBS and ~35.6 GB existed
      only on the Mac, so this is the sole surviving copy. Landed in a dated import
      dir rather than merged into the curated per-star names because the two hosts
      disagreed on both naming (55-cancri vs 55cnc_a) and content (Mac
      'Solar Calibration' 483 files/4.26 GB vs Sirius's 505 files/44 MB -- raw vs
      reduced). Merging it into the curated layout is a separate, reviewable step.
      Distinct from data.spectra, which is the curated Sirius tree.
  data.solar_ew_staging:
    root: local_data
    rel: solar_ew.csv
    kind: file
    desc: Solar EW staging fallback (RYA-706 stage-2 pool ledger).
  engines.ts_data:
    root: engines
    rel: Turbospectrum_NLTE/DATA
    kind: dir
    desc: Turbospectrum DATA dir; the drivers symlink this into their work dir.
  engines.vald_linelists:
    root: engines
    rel: TSFitPy/input_files/linelists/linelist_vald
    kind: dir
    desc: VALD line lists shipped with TSFitPy.
  data.ges_v6_atomic_lines:
    root: data
    rel: linelists/ges_v6/atomic_lines.tsv
    kind: file
    desc: GES v6 atomic line table (TSV).
  data.solar_iag_atlas:
    root: data
    rel: solar_reference/iag_reiners2016/spvis.dat.gz
    kind: file
    desc: IAG solar flux atlas, Reiners et al. 2016.
  work.solar_tmp:
    root: work
    rel: _solar_tmp
    kind: dir
    desc: Shared solar scratch used across the synthesis drivers.
  work.solar_harps_normalized:
    root: work
    rel: _solar_tmp/solar_normalized_harps.csv
    kind: file
    desc: Normalised HARPS solar spectrum consumed by the synthesis drivers.
  engines.ts_source:
    root: engines
    rel: Turbospectrum_NLTE/source
    kind: dir
    desc: Turbospectrum source tree (build provenance checks).
  engines.ts_bsyn:
    root: engines
    rel: Turbospectrum_NLTE/exec-gf/bsyn_lu
    kind: file
    desc: >-
      bsyn_lu as BUILT. NOTE the RYA-567 caveat -- on Sirius the RUNTIME binaries are
      invoked from bin/, and exec-gf/ is the build dir; assert the runtime path.
  engines.ges_nlte_linelist:
    root: engines
    rel: Turbospectrum_NLTE/COM/linelists/nlte_ges_linelist_jmg17feb2022_I_II
    kind: file
    desc: >-
      The bundled GES NLTE line list. ⚠️ Cr I/II are tagged LTE here (RYA-800), so a Cr
      NLTE gate cannot be run from it -- bsyn would silently drop to LTE (RYA-533).
  engines.venv_pysme_python:
    root: data
    rel: venv_pysme/bin/python
    kind: file
    desc: PySME virtualenv interpreter (drivers shell out to it).
  work.repo:
    root: work
    rel: repo
    kind: dir
    desc: Sirius-side repo checkout used by the synthesis drivers.
  work.sr_inspect_csv:
    root: work
    rel: _solar_tmp/Sr_Bergemann2012_INSPECT.csv
    kind: file
    desc: Sr II INSPECT departure table staged for the RYA-551 driver.
  data.spectra_kitt_peak:
    root: data
    rel: spectra/Solar Calibration/Kitt Peak Flux Atlas
    kind: dir
    desc: Kitt Peak solar flux atlas, Sirius-side copy.
  data.kurucz2005_irradiance:
    root: data
    rel: spectra/KITTS/irradthu.dat.txt
    kind: file
    desc: >-
      Kurucz 2005 solar irradiance (irradthu.dat, revised 02jan2010), the
      telluric-CORRECTED Kitt Peak reference. Registered by RYA-933/934 so the two
      properties that bite every naive reader are declared in one place rather than
      rediscovered: the grid is VACUUM (RYA-938 measured it; reading it as air
      displaces every line ~1.7 A at 6600 A) and the flux is ABSOLUTE irradiance in
      W/m2/nm, so the holding ships no continuum. Spans 3000-10000 A.
  data.spectra_vesta_crires:
    root: data
    rel: spectra/vesta/CRIRESPlus
    kind: dir
    desc: Vesta CRIRES+ reflected-solar frames (Sirius-side).
  repo.crires_plus_solar_y_rya794:
    root: repo
    rel: data/results/rya794/vesta_crires_plus_Y_10280_10680_normalized.csv
    kind: file
    desc: >-
      CRIRES+ Vesta solar Y arm, 10280-10680 A, TELLURIC-CORRECTED and already
      continuum-normalised (RYA-794). Built by scripts/normalize_vesta_ir.py from
      Elgueta+2026's sp/Sun_Y_rv.dat; registered as holding
      `solar_crires_plus_y_rya794` with telluric_applied=applied. Two columns,
      wavelength_air_A and flux_normalized, 13707 rows, flux median 0.9985 --
      PRE-NORMALISED IS TRUE FOR THIS HOLDING and false for the raw
      solar_vesta_crires_plus_idp frames of the same instrument, which is why
      normalisation is a per-holding fact and not a per-instrument one (RYA-904).
      It had no register key until RYA-904 and so could not be named by a loader.
  data.solar_iag_baker2020:
    root: srv_solar
    rel: iag_baker2020/iag_telfree_solaratlas.fits
    kind: file
    desc: IAG telluric-free solar atlas, Baker et al. 2020.
  data.solar_wallace2011_kpno:
    root: srv_solar
    rel: wallace2011_kpno
    kind: dir
    desc: >-
      Wallace, Hinkle, Livingston & Davis 2011 (NSO) telluric-removed KPNO solar flux
      atlas, as sptr.reg1-6 in WAVENUMBER. A SECOND, independent reduction of the same
      KPNO data the Kurucz/Brault reference atlas comes from, which is what makes it
      usable as a normalisation cross-check (RYA-485, RYA-846). Region 6 (2899-3525 A)
      is clean; region 5 (2995-4106 A) carries Fortran overflow markers and normalised
      fluxes to +9.98 in the near-UV.
