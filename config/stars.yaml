# config/stars.yaml — SINGLE SOURCE OF TRUTH for per-star fundamental parameters.
# RYA-298: moved out of config/constants.py so per-star data is data, not code.
# Loaded ONLY via config.constants.get_star_params(star_id); no module reads raw values.
# Each record: fundamental teff/logg/feh_ref (+errors), xi (pinned) or xi_init/xi_xcheck
# (solved), broadening (vmac/vsini), pin/solve policy, and source provenance.
# Provenance is mandatory (RYA-355 invariant): every record carries `source` + `logg_basis`.
# GBS scale: Heiter+2015 (Teff/logg, Paper I), Jofré+2014 ([Fe/H], xi, Paper III).
solar:
  teff: 5772.0
  e_teff: 1.0
  logg: 4.438
  e_logg: 0.0
  feh_ref: 0.0
  e_feh: 0.03
  # PINNED at 1.0 (RYA-196). 🔴 RYA-311 MEASURED it and did NOT get 1.0: the Fe I
  #    reduced-EW FITEXY solve on our own production pool returns xi = 0.7088 km/s
  #    (n=58, residual slope -0.0058, production 100 mA saturation ceiling). Moving to
  #    the measured value raises solar A(Fe I) by +0.0595 dex on that route, so the pin
  #    is NOT changed here -- that is a reconciliation for RYA-196 and the register, not
  #    a silent central-value edit. What RYA-311 does change is e_xi below.
  # ⚠️ The pin survives on the production criterion, not on agreement: solving the SAME
  #    sweep with the unweighted OLS slope the vmic bisection actually fits gives
  #    xi_OLS = 0.9088. The 0.20 km/s gap between the two is the both-axis fit, which
  #    down-weights the strong lines OLS treats as equal (Mucciarelli 2011).
  xi: 1.0
  # MEASURED, RYA-311: the formal Delta-chi2 = 1 error on the Fe I reduced-EW slope
  # (Press+1992 FITEXY, both-axis, per Mucciarelli 2011 A&A 528 A44), propagated through
  # the solve as sigma_slope / |d slope / d xi| at the root. Our data, our fit.
  # 🔴 THIS RETIRES BOTH BORROWED NUMBERS FOR THE SUN — the uncited 0.05 from the RYA-158
  #    spec and Jofré+2014's 0.18, which is an INTER-NODE dispersion across seven GBS
  #    pipelines and not the formal error of a single-pipeline analysis. (Jofré's per-star
  #    sigma_vmic stays a defensible INTERIM delta_p for stars we have not yet solved --
  #    procyon and the alpha Cen pair below — until this same solve is run on each.)
  # ⚠️ IT IS NOT THE WHOLE UNCERTAINTY, AND THE GAP IS MEASURED, NOT SUSPECTED. The formal
  #    error answers only "how well is the slope pinned given the EW errors". Moving the
  #    saturation ceiling across 80/100/120 mA — all defensible, 100 is the RYA-330
  #    production constant — moves xi by 0.2695 km/s, 4.6x this number
  #    (data/results/rya311/rya311_xi_ceiling_sensitivity_all.json). And chi2_red at the
  #    solution is 27, so the point errors explain a small part of the scatter; scaling
  #    by sqrt(chi2_red) would give 0.3107 instead. Which of the three belongs in the
  #    Type B budget decides whether the solar bar sits inside or outside its 0.05 gate,
  #    and that is Ryan's call — the ticket's spec is the formal error, so the formal
  #    error is what is recorded.
  e_xi: 0.0588
  e_xi_selection: 0.2695   # measured ceiling sensitivity, NOT summed into e_xi (see above)
  e_xi_chi2_scaled: 0.3107 # the sqrt(chi2_red)-inflated alternative, recorded not used
  xi_measured_rya311: 0.7088
  xi_provenance: 'measured, RYA-311, Fe I reduced-EW FITEXY solve on the production solar
    EW pool (data/processed/solar_ew_ges_reference.csv), n=58 after the >10% EW-error cut
    (Mucciarelli 2011) and the 100 mA saturation ceiling (RYA-330)'
  vmac: 3.8
  vsini: 1.8
  source: 'GBS: Heiter+2015 (Teff/logg), Jofré+2014 ([Fe/H], ξ)'
  logg_basis: IAU nominal solar mass + radius (logg fixed to ~0.001 dex)
  pin:
  - teff
  - logg
  - xi
  solve:
  - feh
procyon:
  teff: 6554.0
  e_teff: 84.0
  logg: 4.0
  e_logg: 0.02
  feh_ref: 0.03
  e_feh: 0.04
  xi: 1.8
  # Jofré+2014 (A&A 564, A133) Table 2 σvmic — "the mean vmic value obtained by the different nodes, with σvmic representing the standard deviation of this mean"
  # ⚠️ Table 2's vmic is a MEAN ACROSS NODES and does not always equal the
  #    xi adopted above; only the DISPERSION is taken as the uncertainty.
  e_xi: 0.11
  vsini: 2.8
  vmac: 6.0
  source: 'GBS: Heiter+2015 (Teff/logg), Jofré+2014 ([Fe/H], ξ=1.8); broadening: Bruntt+2010
    vsini=2.8 + adopted RT vmac=6.0 (Gray scale; FT estimator deferred to RYA-316)'
  logg_basis: astrometric binary mass (Procyon B WD) + interferometric radius
  pin:
  - teff
  - logg
  - xi
  solve:
  - feh
alpha_cen_a:
  teff: 5792.0
  e_teff: 16.0
  logg: 4.3
  e_logg: 0.01
  feh_ref: 0.2
  e_feh: 0.04
  xi: 1.1
  # Jofré+2014 (A&A 564, A133) Table 2 σvmic — "the mean vmic value obtained by the different nodes, with σvmic representing the standard deviation of this mean"
  # ⚠️ Table 2's vmic is a MEAN ACROSS NODES and does not always equal the
  #    xi adopted above; only the DISPERSION is taken as the uncertainty.
  e_xi: 0.07
  vsini: 1.9
  vmac: 2.3
  source: 'GBS: Heiter+2015 (Teff/logg), Jofré+2014 ([Fe/H], ξ); broadening: Bruntt+2010
    (MNRAS 405,1907) Table B1 vsini=1.9 + vmac=2.3 (RT, Gray scale)'
  logg_basis: dynamical binary mass + VLTI interferometric radius + asteroseismology
  pin:
  - teff
  - logg
  - xi
  solve:
  - feh
alpha_cen_b:
  teff: 5231.0
  e_teff: 20.0
  logg: 4.53
  e_logg: 0.03
  feh_ref: 0.2
  e_feh: 0.04
  xi: 1.0
  # Jofré+2014 (A&A 564, A133) Table 2 σvmic — "the mean vmic value obtained by the different nodes, with σvmic representing the standard deviation of this mean"
  # ⚠️ Table 2's vmic is a MEAN ACROSS NODES and does not always equal the
  #    xi adopted above; only the DISPERSION is taken as the uncertainty.
  e_xi: 0.31
  vsini: 1.0
  vmac: 0.8
  source: 'GBS: Heiter+2015 (Teff/logg), Jofré+2014 ([Fe/H], ξ); broadening: Bruntt+2010
    (MNRAS 405,1907) Table B1 vsini=1.0 + vmac=0.8 (RT, Gray scale)'
  logg_basis: dynamical binary mass + VLTI interferometric radius + asteroseismology
  pin:
  - teff
  - logg
  - xi
  solve:
  - feh
55cnc_a:
  teff: 5196.0
  e_teff: 24.0
  logg: 4.45
  e_logg: 0.01
  feh_ref: 0.31
  e_feh: 0.04
  xi_init: 1.0
  xi_xcheck:
  - 0.85
  - 1.35
  source: von Braun et al. 2011, ApJ 740, 49; ξ x-check Teske+2013 / Ecuvillon+2004
  logg_basis: CHARA interferometric R=0.943 Rsun (theta_LD 0.711 mas + van Leeuwen
    2007 parallax) + Yonsei-Yale isochrone M=0.905 Msun (model-dependent mass)
  pin:
  - teff
