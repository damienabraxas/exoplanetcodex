# config/stars.yaml — SINGLE SOURCE OF TRUTH for per-star fundamental parameters.
# RYA-298: moved out of config/constants.py so per-star data is data, not code.
# Loaded ONLY via config.constants.get_star_params(star_id); no module reads raw values.
# Each record: fundamental teff/logg/feh_ref (+errors), xi (pinned) or xi_init/xi_xcheck
# (solved), broadening (vmac/vsini), pin/solve policy, and source provenance.
# Provenance is mandatory (RYA-355 invariant): every record carries `source` + `logg_basis`.
# GBS scale: Heiter+2015 (Teff/logg, Paper I), Jofré+2014 ([Fe/H], xi, Paper III).
solar:
  teff: 5772.0
  e_teff: 1.0
  logg: 4.438
  e_logg: 0.0
  feh_ref: 0.0
  e_feh: 0.03
  xi: 1.0
  vmac: 3.8
  vsini: 1.8
  source: 'GBS: Heiter+2015 (Teff/logg), Jofré+2014 ([Fe/H], ξ)'
  logg_basis: IAU nominal solar mass + radius (logg fixed to ~0.001 dex)
  pin:
  - teff
  - logg
  - xi
  solve:
  - feh
