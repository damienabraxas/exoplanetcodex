# RYA-1037 — line-key findings that are KNOWN and OWNED, not fixed in this pass.
#
# A waiver is not a suppression: every entry names the ticket that will fix it and
# why it is safe to defer. The guard still FAILS on any finding not listed here, and
# on a NEW finding in a file that is listed — the waiver names the site, not the
# file's future.
#
# These are one-off analysis scripts, not the production measurement path. The
# pipeline/ sites are fixed or rerouted under RYA-1037 itself.
waivers:
  # ── pipeline/ — the production measurement path ──
  # 🔴 NONE of these can be rerouted through pipeline/line_match.py TODAY, and the reason is
  # the same one every time: THE LEFT SIDE HAS NO EXCITATION POTENTIAL. The matcher refuses
  # rather than falling back to lambda-only, which is the correct behaviour and is exactly
  # why it cannot be dropped in yet. Measured, not assumed:
  #   * data/measured/sol_ew_results_v1.csv has NO ep column at all -> every EW-side match
  #     is blocked on RYA-1036 (thread EP through the product path).
  #   * nlte_correction() is called with (ion, wave_A) only; the MPIA grid is keyed on
  #     (ion, round(lambda, 3)) with no level information -> blocked on threading EP into
  #     the NLTE call signature and grid key (RYA-317's territory).
  # So item C of RYA-1037 is SEQUENCED, not skipped: the guard holds the line while the EP
  # plumbing lands, and each site flips from waived to rerouted as its input gains an EP.

  - kind: ROUNDED_WAVE_KEY
    file: pipeline/abundances_derive.py
    count: 1
    ticket: RYA-1036
    reason: >-
      Fe II linemask cache key built from np.round(wave, 3); the linemask carries no EP.
      Blocked on EP reaching the product path.

  - kind: ARGMIN_ON_WAVE
    file: pipeline/curate_nonfe_pools.py
    count: 2
    ticket: RYA-1036
    reason: >-
      Nearest-wavelength pick against canonical_gf, then the EP is READ FROM the matched
      row — there is no EP on the measured side to check against. sol_ew_results_v1.csv has
      no ep column; verified, not assumed. Blocked on RYA-1036.

  - kind: WAVE_ONLY_MERGE
    file: pipeline/lines_fit.py
    count: 1
    ticket: RYA-1036
    reason: >-
      Ni EW merge on wavelength; the EW frame carries no EP. Blocked on RYA-1036.

  - kind: WAVE_ONLY_TOL
    file: pipeline/nlte_cno.py
    count: 1
    ticket: RYA-317
    reason: >-
      CNO NLTE grid lookup by wavelength tolerance; the grid node carries no level
      identification. Blocked on EP in the NLTE grid key.

  - kind: ROUNDED_WAVE_KEY
    file: pipeline/nlte_corrections.py
    count: 2
    ticket: RYA-317
    reason: >-
      The MPIA grid interpolator is keyed on (ion, round(lambda, 3)) — a rounded float as a
      dict key, the RYA-1033 class. Fixing it means re-keying the grid on the transition,
      which changes the NLTE call signature; value-visible, so it is its own change.

  - kind: ARGMIN_ON_WAVE
    file: pipeline/nlte_corrections.py
    count: 4
    ticket: RYA-317
    reason: >-
      Nearest-grid-node pick on wavelength alone. Same blocker as above.

  - kind: WAVE_ONLY_TOL
    file: pipeline/nlte_corrections.py
    count: 2
    ticket: RYA-317
    reason: >-
      The tolerance check that follows the argmin. Same blocker.

  - kind: WAVE_ONLY_TOL
    file: pipeline/uv_line_selection.py
    count: 1
    ticket: RYA-1037
    reason: >-
      UV line selection matches a species+wavelength against a curated dict with no EP
      field. Reroutable once the UV line table carries EP; smallest of the six and the
      natural first one to convert.

