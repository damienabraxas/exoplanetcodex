      same population, and the matched subset stops being unrepresentative (its anchor
      median -0.0387 against the full band's -0.0374). The verdict is still NOT_VALIDATED,
      but now for one isolated reason instead of an ambiguous slice.
      LEG 3 PASSES: our <3D>-LTE minus 1D-LTE is +0.0860 against Amarsi's own
      <3D>-minus-1D +0.0727, difference +0.0133 inside the inherited 0.05. That referee is
      nmtd_lmarcs minus nmtd_lmtd, which cancels the <3D>-NLTE term exactly -- a
      subtraction of two released columns, not a model of ours. It settles the atmosphere
      rung as PHYSICAL and kills the ingestion-bias hypothesis: a ~+0.08 additive bias in
      our <3D>-LTE leg would have shown up here as a ~+0.08 disagreement.
      What remains is the NLTE rung alone: ours +0.033, Bergemann MPIA +0.010, Amarsi
      -0.039, with ours ~ +0.050 + 0.44 x anchor per line -- correctly signed, ~44%
      amplitude. Chased on RYA-1045.
