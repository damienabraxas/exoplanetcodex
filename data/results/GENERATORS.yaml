  - artifact: solar_ba_synthesis_rya559.json
    status: UNREPRODUCIBLE
    generator: null
    ticket: RYA-559
    note: >-
      CASE 1 of RYA-686, and the reason this manifest exists. RYA-559's merge commit
      564824a shipped this JSON, a phase_c hook and tests/test_solar_ba_synthesis_rya559.py,
      but not the synthesis harness. `scripts/rya559_ba2_synth_sirius.py` has never been
      committed on ANY branch (verified with `git log --all --diff-filter=A -- 'scripts/*559*'`)
      and a filesystem-wide search of Sirius found only this result JSON. A(Ba) = 2.410 is
      therefore NOT INDEPENDENTLY CHECKABLE. It is deliberately NOT back-filled with a
      reconstructed script: RYA-581 rebuilt a harness off the RYA-551 pattern, and that
      harness generates RYA-581's own re-measurement, not this file. This entry is the
      honest record and should be retired only by superseding the artifact, never by
      pointing it at a script that did not produce it.

