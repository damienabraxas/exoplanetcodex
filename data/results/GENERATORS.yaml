      aggregate is gf-homogeneous: 7836.134 is the pool's only Kurucz-1975 (K75)
      semi-empirical gf and is reported beside the product, not averaged in. sigma is FLOORED
      at the RYA-771 0.01 dex quantiser tread — the three experimental-gf lines return
      byte-identical A, so the raw line-to-line sd is exactly 0 and quoting it would claim
      precision the pinned engine cannot express.

