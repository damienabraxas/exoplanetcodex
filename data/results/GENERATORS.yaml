      precision. The BEFORE column in this artifact is a COUNTERFACTUAL, not history.
      All six published counts (159 canonical_gf resolved, 16/0 Fe I/Fe II graded overlap,
      121 comparable, 67 identical, 159 Heiter) reproduce as clean-region plateau values
      with 0.015 A inside every plateau; nothing moved.
      🔴 METHOD FINDING, back to RYA-1109: "longest run of equal values" is NOT sufficient
      as a plateau rule. Past the point where the lambda+EP key stops discriminating the
      count goes flat because the matcher REFUSES ambiguous lines while the displaced null
      admits coincidences -- saturation, not agreement. Applied naively here it picks
      157 (not 159) and 119 (not 121) from a region that is already leaking chance matches.
      A plateau is only evidence inside the region with zero ambiguity AND zero null.
      Fe II structural zero confirmed as a wavelength fact: our graded Fe II is
      4173.45-4583.83 A, the GBS Fe II set 4993.36-6456.38 A, closest cross-pair 409.53 A
      = 27302x the derived window. No tolerance could create that overlap.
