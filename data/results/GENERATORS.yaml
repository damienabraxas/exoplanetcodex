    ticket: RYA-560
    note: >-
      CASE 2 of RYA-686, now resolved. As shipped by RYA-560 this harness declared NO
      argparse at all, so the `--deblend` entrypoint RYA-585's brief called for did not
      exist and had to be added. RYA-585 added it, and the flagless invocation above is
