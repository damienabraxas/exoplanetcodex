    generator: scripts/derive_band_products.py
    invocation: python3 scripts/derive_band_products.py --star solar --element Fe --ion I --lo 3000 --hi 3780 --instrument kpno_solar_atlas --holding solar_kpno_molecfit_corrected --lines-tier graded
    ticket: RYA-1027
    note: >-
      RYA-1027: the AT-OR-BELOW-GATE graded near-UV cell. 🔴 THIS IS A DECLARED GAP, NOT A
      VALUE -- n=1. Of 59 lab-tier Fe I lines in 3000-3780 A, exactly ONE sits at or below the
      0.6 central-depth gate, and it is at 3026.056 A, deep inside the CONTINUUM_LIMITED
      blue-edge regime (RYA-451/460) where no true continuum exists in any window. It returns
      A(Fe I) = 8.529, about 1.0 dex above solar, which is what an n=1 continuum-limited line
      produces. Committed as EVIDENCE of the gap, never as a measurement -- suppressing it
      would make the empty tier look like an absence of data rather than the structural finding
      it is (RYA-833). This reproduces RYA-954 at band scale: lab Fe I is a DEEP/SATURATED
      population, so the EW depth gate empties the graded tier.
