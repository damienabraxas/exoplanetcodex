  - artifact: rya1009/rya1009_al_gf_swap_summary.json
    generator: scripts/rya1009_al_gf_pool_rebuild.py
    invocation: python3 scripts/rya1009_al_gf_pool_rebuild.py
    ticket: RYA-1009
    note: >-
      Counts and the firewall statement. The swap is justified by PROVENANCE — Burheim
      2023 is experimental (FTS branching fractions x radiative lifetimes, 2-11%
      per-line) and the incumbent is Kurucz-1995 semi-empirical — and that justification
      was fixed BEFORE the abundance effect was examined. It moved A(Al) UP, toward the
      6.43 anchor (KP 6.268 -> 6.377, IAG 6.289 -> 6.395, HARPS 6.267 -> 6.393); that is
      the OUTCOME and is not the reason. Nothing in the generator references 6.43.
      The larger result is the error bar: the gf rung goes 1 -> 3 and the systematic
      falls 0.1726 -> 0.0374 dex, now MEASURED (the papers' own per-line sigma) rather
      than the 0.20 blanket bound.
      Al Phase-0 census: 502 physical transitions collapsed from 1117 linelist_solar rows,
      per band, with the best gf source on a provenance-only ladder (experiment >
      independent theory > NIST grade > Opacity Project > Kurucz-1975), HFS component
      count, per-instrument home and tier. The gf column is the SUM over hyperfine
      components, not the strongest one: line_accounting_rya709 reports the max, which
      under-reports Al I 6696.02 by 0.43 dex. Grouping is in WAVENUMBER because hyperfine
      splitting is bounded in energy - the largest gap inside a known Al multiplet is
      0.070 cm-1 and the smallest gap between distinct lines is 1.345 cm-1, so the 0.30
      cm-1 cut sits in measured empty space rather than being chosen.
