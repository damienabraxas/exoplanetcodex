    generator: scripts/rya931_normalize_corrected.py
    invocation: python scripts/rya931_normalize_corrected.py <corrected_exposures_dir> data/processed/solar_normalized_tellcorr.csv
    ticket: RYA-931; RYA-939
    note: >-
      The telluric-CORRECTED sibling, holding solar_harps_molecfit_corrected. Same ten
      exposures and the same normaliser, with O2 B divided out per exposure by its own
      molecfit/GDAS transmission. 256 saturated-core pixels are NaN — quarantined, not
      divided. Differs from solar_normalized.csv by the correction and nothing else, which
      the byte-identical reproduction control above is what establishes. Do NOT diff the
      two as if the difference were confined to the O2 band: continuum fitting is global,
