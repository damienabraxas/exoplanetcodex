# Result-artifact generator manifest (RYA-686).
#
# THE RULE: a result artifact must not land in data/results/ without the committed
# script that generates it. This file is the link between the two, and
# `scripts/check_result_generators.py` enforces it in CI, in BOTH directions --
# an artifact with no entry fails, and an entry naming a missing artifact or a
# missing generator fails. Drift is a build break, never a silent divergence.
#
# WHY IT EXISTS: RYA-559's merge (564824a) shipped solar_ba_synthesis_rya559.json,
# a phase_c hook and a test, but NOT the synthesis harness -- which has never existed
# in this repo on any branch and is not on Sirius either. Ba landed on the board at
# 2.410 from a measurement nobody can re-run, and RYA-581 had to rebuild the harness
# from scratch. See docs/CONVENTIONS.md for the full convention and the reasoning
# behind choosing a manifest over a naming convention or an in-artifact `_meta` field.
#
# ENTRY SCHEMA
#   artifact:   REQUIRED. Path relative to data/results/.
#   status:     COMMITTED (default) | HAND_AUTHORED | UNREPRODUCIBLE.
#   generator:  repo-relative path to the code that WRITES the artifact. Required for
#               COMMITTED; must be `null` for the other two.
#   invocation: optional but strongly preferred -- the command that regenerates it.
#               `--check-invocations` verifies every long flag here is actually declared
#               by the generator's argparse, which is what catches the RYA-560 class
#               (committed, but not invocable as documented).
#   ticket:     REQUIRED. No entry without a ticket.
#   note:       REQUIRED for HAND_AUTHORED and UNREPRODUCIBLE.
#   sources:    REQUIRED for HAND_AUTHORED -- where the numbers came from.
#
# WHAT MUST NEVER BE ADDED HERE: a `generator:` naming a script that was written after
# the fact and presented as the original. If a measurement is not reproducible, the
# honest entry is `status: UNREPRODUCIBLE` with a note. A re-measurement gets its own
# artifact and its own entry (RYA-581 -> solar_ba_deblend_rya581.json); it does not
# retroactively become the provenance of the old one.

