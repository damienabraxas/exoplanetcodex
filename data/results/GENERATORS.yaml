      exposures, 2023-08-02) — the source of every line in the committed EW pool. It had
      never been tracked: the single most consequential product in the repo existed only
      on disk and in the RYA-461 artifact store, and depended on the ten source ADPs
      staying alive on Sirius. RYA-931 proved it is exactly reproducible — re-running
      spectra_normalize on those ten originals returns SHA-256
      6100681d530ffe59c7ea8ba6ee3055ce374d9bd77b73c84b413e1745c8302af4 byte for byte —
      and that control is what makes committing it a record rather than a snapshot.
      Source exposure checksums are pinned in
