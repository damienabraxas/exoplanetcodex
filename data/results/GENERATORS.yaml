    note: >-
      THE SECOND HALF OF THE NEAR-UV CONTINUUM TERM. RYA-841 measured the lever (2.42 over
      all lines, 2.54 over the 28 that have a derivative); this measures sigma_delta by
      comparing the Kitt Peak reference atlas against Wallace+2011 (NSO), an INDEPENDENT
      reduction of the same band. At the 40 product lines the two disagree by rms 4.94%,
      of which 4.07% is Wallace disagreeing with ITSELF (its regions 5 and 6 overlap), so
      the net reduction difference is 2.79% and the honest term spans 0.071 dex (net) to
      0.125 dex (raw upper bound) against the 0.100 the budget assumes -- which lands
      inside the measured range despite having been derived by equating percent flux with
      dex. 🔴 THE OBVIOUS ROUTE IS DEAD: the atlas's own 20 in-band segment overlaps are
      BYTE-IDENTICAL duplicates (same grid, flux difference exactly 0.0), so they would
      have returned sigma_delta ~ 0 and a continuum term of ~0.
