      Same harness as zr2_synthesis_rya560.json, different entrypoint: `--deblend` runs
      `main_deblend()`, which refits the three strong Zr II lines with blends modelled
      in-window. This is the entry whose flag `--check-invocations` verifies against the
      source, so a future removal of `--deblend` becomes a build break rather than a
      brief that no longer works.

