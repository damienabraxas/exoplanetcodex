    note: >-
      LTE in-window HFS synthesis of 5 Eu II lines x 2 arms. Emits NO abundance --
      the disposition is owed-no-value (Eu II 6645 returns dEW/dA 13.9 against the
      40.0 floor). The artifact records the fit and the reason, which is exactly why
      it must stay reproducible: the owed verdict rests on it. Optional flags
      `--lines` and `--skip-sensitivity` both default to the full run recorded here.

