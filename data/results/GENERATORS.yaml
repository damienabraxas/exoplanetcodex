    note: >-
      RYA-1127 migration audit for adding `line_set` to the product identity key. Computes every product's key BOTH ways over all four pools and compares the PARTITIONS, because the failure mode of a key change is a wrong SPLIT or MERGE, not a wrong number -- no abundance moves in that ticket. Result on the committed feed: 104 records, 95 old keys -> 95 new keys, partition UNCHANGED, so nothing already published was re-identified. Also stages the RYA-1106 case (not a publish): the four Asplund-replication products collided with the our-graded Amarsi products under the old key and are distinct under the new one. --check exits non-zero on any merge, any split whose members share a line_set, or any record whose line_set cannot be resolved.
