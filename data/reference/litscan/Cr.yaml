# LITSCAN -- Cr (RYA-1268 minimum anchor; transcribed from AGSS21 Table 2, Lodders,
# Bergemann & Palme 2025 Table 2 and Amarsi & Grevesse 2026 Table 3). Precursor: the
# element's own literature sweep re-projects this file.
# Band = anchor +/- sigma, DEVIATE at 2 sigma (Si/Al rule). Anchor: AG26 changed this element (AGSS21 5.62 +/- 0.04 -> AG26 5.65 +/- 0.04) (RYA-1251).
element: Cr
ion: I
ions: [I, II]
source_of_truth: RYA-1268
scale: as adopted by AG26 (3L, full weight to Cr II)
entries:
  - source: Amarsi & Grevesse 2026
    citation: Solar chemical composition, arXiv 2608.23155, Table 3
    value: 5.65
    sigma: 0.04
    role: best external (anchor)
    method: 3L, full weight to Cr II
  - source: Lodders, Bergemann & Palme 2025
    citation: Space Science Reviews (accepted 2025-02-07), Table 2; local AbundancesLodders.pdf
    value: 5.74
    sigma: 0.11
    role: corroborating
    note: Lodders quality flag B-.
  - source: Asplund, Amarsi & Grevesse 2021
    citation: A&A 653, A141, Table 2 (doi:10.1051/0004-6361/202140445)
    value: 5.62
    sigma: 0.04
    role: corroborating (superseded by AG26)
    method: Scott et al. 2015 (A&A 573, A26) + Lawler et al. 2017 Cr II gf
range:
  central: 5.65
  min: 5.61
  max: 5.69
  best_external: Amarsi & Grevesse 2026 (arXiv 2608.23155)
  sigma_external: 0.04
  deviate_beyond: 0.08
  derivation: best-external-plus-sigma
  is_statistical_spread: false
verification_owed:
  - Huber & Sandeman 1977, Cooper+1997 and Hannaford & Lowe 1981 are paywalled and owed on RYA-1283.
  - Tian+2021 (JQSRT 274, 107880; Cr I lab, 67 lines 213-541 nm) is paywalled and owed on RYA-1283.
literature_sweep:
  bands:
    - ion: I
      band: near-UV
      searched: [Sobeck+2007, Blackwell-Whitehead+1984 and 1986, Tozzi+1985, Tian+2021 (owed, RYA-1283), NIST ASD, VALD gf references]
      result: 38 Sobeck lab lines in the lab table; Blackwell tables add no line and agree with NIST within 0.002 dex. Tozzi+1985 transcribed 2026-11-09 (54 lines); it adds lab gf to 3160.611 and 3169.575.
    - ion: I
      band: VIS
      searched: [Scott+2015, AGSS21, AG26, Lodders+2025, Sobeck+2007, Blackwell-Whitehead+1984 and 1986, Tozzi+1985, Tian+2021 (owed, RYA-1283), Heiter+2021, NIST ASD, VALD gf references]
      result: 29 Scott set lines plus 178 Sobeck lab lines; 10 Sobeck gf adopted. 4026.21 stays on list gf.
    - ion: I
      band: red-optical
      searched: [Sobeck+2007, Tozzi+1985, Heiter+2021, NIST ASD, VALD gf references]
      result: 1 Sobeck lab line. Tozzi+1985 (lab, 290-900 nm) adds 8916.24 (-1.41 +/- 0.12), 8939.19 (-2.08 +/- 0.15) and 8955.75 (-1.92 +/- 0.15), found 2026-11-09; the list already carries these values via the MFW compilation, untagged, now graded from Tozzi (scripts/rya728_transcribe_tozzi1985.py).
    - ion: I
      band: NIR
      searched: [Sobeck+2007, Gaia FGK benchmarks 2026 Table B.2, NIST ASD, VALD gf references]
      result: 9 Sobeck lab lines, 4 of them added to the list. NIST has no Cr log gf beyond 9200 A. Tozzi+1985 stops at 900 nm; a 2026-11-09 web search found no Cr I lab gf beyond it. Gaia solar lines are all in the list on VALD gf.
    - ion: I
      band: H
      searched: [Smith+2021, Gaia FGK benchmarks 2026 Table B.2, NIST ASD, VALD gf references]
      result: No lab gf; Smith+2021 uses Kurucz 2017. A 2026-11-09 web search found no Cr I lab gf in the H or K band. Ungraded diagnostic on 5 lines gives 5.62-5.73 on three, 6.46 on one, one unphysical.
      diagnostic: data/audit/orchestrator_prepare/solar_Cr_band_diagnostics.csv
    - ion: I
      band: K
      searched: [Gaia FGK benchmarks 2026 Table B.2, NIST ASD, VALD gf references]
      result: No lab gf. Ungraded diagnostic on 6 lines gives 5.36-5.65 on four, 6.58 on one, one unphysical.
      diagnostic: data/audit/orchestrator_prepare/solar_Cr_band_diagnostics.csv
    - ion: II
      band: near-UV
      searched: [Lawler+2017, Gurell+2010, Nilsson+2006, Ward+2023, Engstrom+2014, Tayal & Zatsarinny 2019 (theory), NIST ASD, VALD gf references]
      result: Ward+2023 (NIST lab, 268 lines 208-414 nm, 10-26%) adopted 2026-11-09 on 76 rows, and it outranks Gurell+2010 on the 22 lines both measured where Gurell was not already held. Ward re-measured Gurell's levels with Gurell's lifetimes and reports a calibration problem, a misidentified line and three likely-incorrect A-values in Gurell; Ward agrees with the VALD gf to about 0.1 dex. Held by the 0.5 dex rule are 3077.589 and 3421.616; Engstrom+2014 lines are 282-299 nm, below this band; Tayal & Zatsarinny is theory (held, RYA-1351). 155 lab lines in the lab table. Gurell gf adopted on 32 rows and Nilsson on 3 across near-UV and VIS; 3665.98 held for a move over 0.5 dex. 3179.45 and 3183.33 stay held on the list gf (-1.375, -0.325), ungraded, because Gurell was already held on both for a move over 0.5 dex, and the two lab sources disagree by 0.86 and 0.75 dex, so a later source does not clear the hold by itself; a better lab gf can release it through data/reference/gf_hold_releases.csv (Ryan 2026-11-10; guard already_held in rya1268_adopt_lab_gf.py). Both are GF_DISCREPANCY rows for the RYA-1378 register. On Kitt Peak, 1D LTE, the list gf gives A(Cr) 5.555 and Gurell gf -0.965 gives 6.192, about 0.57 dex above the solar 5.62. The cause is not established; the line may be blended.
    - ion: II
      band: VIS
      searched: [Scott+2015, AGSS21, AG26, Lawler+2017, Gurell+2010, Nilsson+2006, Ward+2023 (to 414 nm), Heiter+2021, NIST ASD]
      result: 10 Scott set lines plus 75 lab lines. 4891.49 and 6421.71 held for moves over 0.5 dex. 4627.654 unresolved and recorded, Gurell gf 3.4 dex above both theories.
    - ion: II
      band: red-optical
      searched: [Lawler+2017, Gurell+2010, Nilsson+2006, Ward+2023, Engstrom+2014, Tayal & Zatsarinny 2019 (theory), NIST ASD, VALD gf references, web search 2026-11-09]
      result: No lab gf; none of the lab tables reach this band. The list gf is Raassen & Uylings theory, a theoretical-grade candidate (data/audit/orchestrator_prepare/solar_Cr_atomic_gap_candidates.csv). Ungraded diagnostic gives 5.52 from 7311.61, the only line that came back.
      diagnostic: data/audit/orchestrator_prepare/solar_Cr_band_diagnostics.csv
    - ion: II
      band: NIR
      searched: [Lawler+2017, Gurell+2010, Nilsson+2006, Ward+2023, Engstrom+2014, Tayal & Zatsarinny 2019 (theory), NIST ASD, VALD gf references, web search 2026-11-09]
      result: No lab gf. The only two rows are Kurucz lines at 13 eV on the band edge and are not in the synthesis list, so nothing can be fitted.
      diagnostic: data/audit/orchestrator_prepare/solar_Cr_band_diagnostics.csv
    - ion: II
      band: H
      searched: [Smith+2021, NIST ASD, VALD gf references]
      result: No Cr II lines in the list.
    - ion: II
      band: K
      searched: [NIST ASD, VALD gf references]
      result: No Cr II lines in the list.
