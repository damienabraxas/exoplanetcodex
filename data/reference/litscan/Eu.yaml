  - source: Storm et al. 2024
    citation: A&A 683, A200 (doi:10.1051/0004-6361/202348971)
    value: 0.57
    sigma: 0.06
    role: corroborating
    method: 3D NLTE, Eu II 6645.1 only (blended by weak unknown lines); Lodders 2025's Eu source
range:
