# LITSCAN -- Eu (RYA-1268 minimum anchor; transcribed from AGSS21 Table 2, Lodders,
# Bergemann & Palme 2025 Table 2 and Amarsi & Grevesse 2026 Table 3). Precursor: the
# element's own literature sweep re-projects this file.
# Band = anchor +/- sigma, DEVIATE at 2 sigma (Si/Al rule). Anchor: AG26 changed this element (AGSS21 0.52 +/- 0.04 -> AG26 0.49 +/- 0.05) (RYA-1251).
element: Eu
ion: II
ions: [II]
source_of_truth: RYA-1268
scale: as adopted by AG26 (3N)
entries:
  - source: Amarsi & Grevesse 2026
    citation: Solar chemical composition, arXiv 2608.23155, Table 3
    value: 0.49
    sigma: 0.05
    role: best external (anchor)
    method: 3N
  - source: Lodders, Bergemann & Palme 2025
    citation: Space Science Reviews (accepted 2025-02-07), Table 2; local AbundancesLodders.pdf
    value: 0.57
    sigma: 0.06
    role: corroborating
    note: Lodders quality flag A-.
  - source: Asplund, Amarsi & Grevesse 2021
    citation: A&A 653, A141, Table 2 (doi:10.1051/0004-6361/202140445)
    value: 0.52
    sigma: 0.04
    role: corroborating (superseded by AG26)
    method: Grevesse et al. 2015 update of Lawler et al. 2001 (HM synthesis)
  - source: Lawler et al. 2001
    citation: ApJ 563, 1075, Table 6 (doi:10.1086/323407)
    value: 0.52
    sigma: 0.04
    role: corroborating
    method: 1D LTE (HM74) synthesis of disc-centre intensity, 14 Eu II lines weighted 1-3; AGSS21's base value
  - source: Mucciarelli et al. 2008
    citation: A&A 484, 841 (doi:10.1051/0004-6361:20079327)
    value: 0.52
    sigma: 0.02
    role: corroborating
