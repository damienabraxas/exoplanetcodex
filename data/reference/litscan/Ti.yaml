# LITSCAN -- Ti (RYA-1268 minimum anchor; transcribed from AGSS21 Table 2, Lodders,
# Bergemann & Palme 2025 Table 2 and Amarsi & Grevesse 2026 Table 3). Precursor: the
# element's own literature sweep re-projects this file.
# Band = anchor +/- sigma, DEVIATE at 2 sigma (Si/Al rule). Anchor: AG26 unchanged from AGSS21; AGSS21 kept (RYA-1251).
element: Ti
ion: II
ions: [I, II]
source_of_truth: RYA-1268
scale: as adopted by AGSS21 (Scott et al. 2015 (A&A 573, A26), Ti II only)
entries:
  - source: Asplund, Amarsi & Grevesse 2021
    citation: A&A 653, A141, Table 2 (doi:10.1051/0004-6361/202140445)
    value: 4.97
    sigma: 0.05
    role: best external (anchor)
    method: Scott et al. 2015 (A&A 573, A26), Ti II only
  - source: Lodders, Bergemann & Palme 2025
    citation: Space Science Reviews (accepted 2025-02-07), Table 2; local AbundancesLodders.pdf
    value: 4.97
    sigma: 0.11
    role: corroborating
    note: Lodders quality flag B-.
  - source: Amarsi & Grevesse 2026
    citation: Solar chemical composition, arXiv 2608.23155, Table 3
    value: 4.97
    sigma: 0.05
    role: corroborating (AGSS21 successor; unchanged)
    method: 3L, full weight to Ti II
  - source: Scott et al. 2015
    bib: scott2015
    citation: A&A 573, A26, Sect. 7.2 and Table 1 (local Scott_2015_AA_573_A26_FePeak.pdf)
    ion: I
    value: 4.88
    sigma: 0.05
    scale: 3D+NLTE (NLTE from the Bergemann 2011 atom, S_H = 1, disk-centre intensity)
    role: Ti I validation (RYA-1315); NOT the anchor
    method: 34 Ti I lines, 24 with Lawler 2013 gf; +-0.01 stat +-0.05 sys
    note: >-
      Ti I sits 0.09 dex below Ti II (4.97 +- 0.04) in the same analysis; the authors
      attribute it to NLTE underestimated in <3D> or to S_H = 1. AGSS21 and AG26 therefore
      take the abundance from Ti II alone. A Ti I product near 4.88 reproduces the
      literature; it does not contradict the anchor.
range:
  central: 4.97
  min: 4.92
  max: 5.02
  best_external: Asplund et al. 2021 (A&A 653, A141)
  sigma_external: 0.05
  deviate_beyond: 0.10
  derivation: best-external-plus-sigma
  is_statistical_spread: false
verification_owed:
  - Minimum anchor only; the element's literature sweep adds per-band references.
