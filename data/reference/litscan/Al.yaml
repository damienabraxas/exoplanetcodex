# Machine-readable projection of the living RYA-716 Al dossier for RYA-925.
element: Al
ion: I
source_of_truth: RYA-716
sweep_umbrella: RYA-709
scale: 3D-NLTE
scale_note: >-
  The adopted solar abundance is a 3D+NLTE result. Every current RYA-925 product
  is therefore a diagnostic cross-scale comparison until a 3D-NLTE route runs.
entries:
  - source: Asplund et al. 2021
    citation: A&A 653, A141
    value: 6.43
    sigma: 0.04
    scale: 3D-NLTE
    role: independent adopted solar anchor in RYA-716
    note: >-
      Scott et al. 2015 derive 6.43 +/- 0.04 (0.01 statistical, 0.04 systematic)
      from screened Al I lines with a 3D hydrodynamic solar atmosphere and NLTE
      corrections; three 1D atmospheres and mean-3D quantify model systematics.
  - source: Andrievsky et al. 2020
    citation: arXiv:2006.10998
    value: 6.43
    sigma: 0.04
    scale: 1D-NLTE
    role: line-behaviour and optical/IR consistency check; not an independent anchor
    note: >-
      MULTI departure coefficients were used in SYNTHV blended-spectrum synthesis.
      The study adopted solar Al=6.43 and adjusted IR atomic data to reproduce the
      observed solar spectrum, so its optical/IR agreement is calibration evidence,
      not an independent blind recovery of the solar abundance.
range:
  central: 6.43
  min: 6.39
  max: 6.47
  best_external: Asplund et al. 2021 (A&A 653, A141)
  sigma_external: 0.04
  deviate_beyond: 0.08
  derivation: best-external-plus-sigma
  is_statistical_spread: false
  basis: >-
    RYA-716 names 6.43 +/- 0.04 as the adopted external Al comparator. For
    calibration, compare the Codex offset with the quadrature sum of its statistical
    and systematic uncertainties and the literature uncertainty. The central-value
    interval remains descriptive; it is not the replication pass/fail gate.
